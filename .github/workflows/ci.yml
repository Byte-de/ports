name: Check
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Static checks
        run: Scripts/lint.sh
      - name: Test core, features, supervisor and process integration
        run: Scripts/check.sh
      - name: Build release app
        run: Scripts/build-app.sh "$RUNNER_TEMP/Byte Ports.app"
      - name: Validate bundle
        run: Scripts/validate-bundle.sh "$RUNNER_TEMP/Byte Ports.app"
      # Runners without a GUI login session skip with a notice; release.sh requires the launch.
      - name: Smoke-launch app
        run: Scripts/smoke-app.sh --skip-without-gui "$RUNNER_TEMP/Byte Ports.app"
