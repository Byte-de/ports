name: Release
# Every pushed version tag (vX.Y.Z) builds, Developer ID-signs, notarizes and staples Byte Ports, then publishes
# Byte-Ports.dmg as the latest GitHub release. The website and README download from
# releases/latest/download/Byte-Ports.dmg, so the asset name stays exactly "Byte-Ports.dmg". Every build needs a
# fresh notarization; this workflow does it with the repository secrets listed in docs/RELEASING.md.
# Create the tag with Scripts/tag-release.sh --push.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v1.0.1
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: public-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    environment: release
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Validate tag, notes and signing inputs
        env:
          GH_TOKEN: ${{ github.token }}
          CERT: ${{ secrets.DEVID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVID_CERT_PASSWORD }}
          API_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Every check fails explicitly: macOS bash 3.2 ignores a failing [[ ]] or `! command` under `set -e`.
          fail() { echo "::error::$1" >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "Release tags look like v1.2.3, not $RELEASE_TAG."
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          [[ "$RELEASE_TAG" == "v$version" ]] || fail "$RELEASE_TAG doesn't match CFBundleShortVersionString $version."
          # The build number is an integer that grows with every distributed build.
          build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' Resources/Info.plist)
          [[ "$build" =~ ^[1-9][0-9]*$ ]] || fail "CFBundleVersion must be a positive integer, not $build."
          # The notes are the version's final CHANGELOG section, without its heading.
          if grep -q "^## $version (unreleased)" CHANGELOG.md; then
            fail "Remove (unreleased) from the $version CHANGELOG heading before tagging."
          fi
          awk -v version="$version" '/^## / { if (found) exit; found = ($2 == version); next } found' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || fail "CHANGELOG.md has no '## $version' section."
          [[ -n "$CERT" && -n "$CERT_PASSWORD" && -n "$API_KEY" && -n "$KEY_ID" && -n "$ISSUER_ID" ]] ||
            fail "Set the five signing secrets listed in docs/RELEASING.md."
          # Never replace the bytes of a published version.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            fail "$RELEASE_TAG is already published; release a new version instead."
          fi
      - name: Configure temporary signing keychain
        env:
          CERT: ${{ secrets.DEVID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVID_CERT_PASSWORD }}
          API_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/ports-signing.keychain-db"
          password="$(openssl rand -hex 32)"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          xcrun notarytool store-credentials BYTE_NOTARY --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" --keychain "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -1)
          test -n "$identity"
          printf 'SIGN_IDENTITY=%s\n' "$identity" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary.p8"
      - name: Build, sign, notarize and staple
        run: Scripts/release.sh "$RUNNER_TEMP/release"
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --latest --title "Byte Ports ${RELEASE_TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/release/Byte-Ports.dmg" "$RUNNER_TEMP/release/SHA256SUMS"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ports-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary.p8"
