name: Bug report
description: Report a reproducible problem in Byte Ports.
body:
  - type: input
    id: version
    attributes:
      label: Byte Ports and macOS versions
      description: Settings shows the app version; Finder's Get Info on Byte Ports.app adds the build in brackets.
      placeholder: Byte Ports 1.0.0 (3) · macOS 26.x · Apple M-series
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - German
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Explain what happened and what you expected. Redact private paths, command arguments, logs and live sharing links.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant context
      description: Window or notch panel? External display? Reduced motion? Optional redacted screenshot.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: "Optional. The output of `log show --predicate 'subsystem == \"de.byte.ports\"' --last 1h --info` right after the problem. Private values already appear as `<private>`; redact anything else before posting."
      render: text
